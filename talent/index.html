function cohort(){return S.exercises.find(c=>c.id===S.active)||S.exercises[0]}
function people(){return cohort().records}
function person(){return people().find(p=>p.id===V.id)||people()[0]}
function e(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function pnum(n,d=0){return Number(n||0).toLocaleString('en-MY',{maximumFractionDigits:d,minimumFractionDigits:d})}
function pct(n,d){return d?Math.round(n/d*100):0}
function dateNow(){return new Date().toISOString().slice(0,10)}
function dateTime(){return new Date().toLocaleString('en-MY',{year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})}
function pid(){return 'C'+Date.now().toString(36).toUpperCase()}
function counts(rows,key){let o={};rows.forEach(r=>{let a=key(r)||'Not specified';o[a]=(o[a]||0)+1});return Object.entries(o).sort((a,b)=>b[1]-a[1])}
function ico(s){return `<span style="font-size:21px">${s}</span>`}
function ptype(s){if(!s||/Unconfirmed|Not recorded|Not linked|No APX/.test(s))return 'amber';if(/Completed|Received|Verified|Ready Now|Promote|Superstar|Closed|recorded$/.test(s))return 'green';if(/In Development|Defer|Not recommended|Risk/.test(s))return 'red';return 'blue'}
function pill(s,css=''){return `<span class="pill ${css||ptype(s)}">${e(s||'Not recorded')}</span>`}
function btn(label,fn,primary=false){return `<button class="btn ${primary?'primary':''}" onclick="${fn}">${label}</button>`}
function kpi(icon,label,val,small){return `<div class="kpi"><div class="kpi-icon">${icon}</div><div><div class="kpi-label">${e(label)}</div><div class="kpi-value">${val}</div><div class="kpi-sub">${e(small)}</div></div></div>`}
function chartBars(items,total,max=7){return `<div class="bars">${items.slice(0,max).map(([name,n])=>`<div class="bar-row"><div class="bar-name" title="${e(name)}">${e(name)}</div><div class="bar-bg"><div class="bar-fill" style="width:${pct(n,total)}%"></div></div><div class="bar-value">${n}</div></div>`).join('')}</div>`}
function section(title,content,extra=''){return `<section class="panel"><h2>${title}</h2>${extra}${content}</section>`}
function note(t,warn=false){return `<div class="soft-note ${warn?'warning':''}"><div class="notice"><span class="notice-mark">${warn?'⚠':'ⓘ'}</span><div>${t}</div></div></div>`}

function selectors(arr){const heads=counts(people(),p=>p.head||'Unassigned').map(x=>x[0]);const grades=counts(people(),p=>p.grade||'Unassigned').map(x=>x[0]);const sel=(name,values,value,handler)=>`<select aria-label="${e(name)}" onchange="${handler}(this.value)"><option value="All">All ${e(name)}</option>${values.map(v=>`<option value="${e(v)}" ${value===v?'selected':''}>${e(v)}</option>`).join('')}</select>`;

function summaryTab(p){let phases=PHASES;let ix=phases.indexOf(p.workflow);return `<div class="detail-grid">${section('Talent Profile — Evidence',`<div class="fields"><div class="state-card"><strong>APX readiness</strong>${p.apx?pill(p.apx.readiness):pill('Not matched')}<p style="margin-top:10px">Source: ${e(p.apx?.version||'No linked result')}</p></div><div class="state-card"><strong>9-Grid classification</strong>${p.apx?pill(p.apx.grid,'blue'):pill('Not matched')}<p style="margin-top:10px">Imported APX category, not auto-converted into HiPo status</p></div><div class="state-card"><strong>Role fit</strong><div class="info-strong">${p.apx?.roleFit!=null?pnum(p.apx.roleFit,1)+'%':'—'}</div><p>${e(p.apx?.role||'Not available')}</p></div><div class="state-card"><strong>Inner Compass</strong>${pill(p.compass?.status||'Not linked')}<p style="margin-top:10px">VORSE preferences are not competency ratings</p></div></div>`)}${section('Review & Action',`<div class="fields"><div class="state-card"><strong>Talent track</strong>${pill(p.talentTrack,'blue')}<p>Human-classified; may reflect HiPo, specialist or sustained contribution</p></div><div class="state-card"><strong>Panel decision</strong>${pill(p.decision)}<p>${e(p.decisionNote||'No panel conclusion captured')}</p></div></div><div style="margin-top:14px">${btn('Update candidate','openEdit("'+e(p.id)+'")',true)}</div><p class="muted-sm">Next: ${e(p.nextAction||'No next action recorded')}${p.dueDate?' · Due '+e(p.dueDate):''}</p>`)}</div>`+

function assessmentTab(p){return `<div class="detail-grid">${section('APX Leadership Assessment',p.apx?`<div class="fields"><div><span class="smallcaps">Readiness band</span><div style="margin:6px 0">${pill(p.apx.readiness)}</div></div><div><span class="smallcaps">Nine-grid</span><div style="margin:6px 0">${pill(p.apx.grid,'blue')}</div></div><div><span class="smallcaps">APX score</span><div class="info-strong">${pnum(p.apx.score,2)}</div></div><div><span class="smallcaps">Role fit</span><div class="info-strong">${pnum(p.apx.roleFit,2)}%</div></div><div class="full"><span class="smallcaps">Assessed role/context</span><div>${e(p.apx.role||'Not specified')}</div></div><div class="full"><span class="smallcaps">Source version</span><div>${e(p.apx.version||'')}</div></div></div>`:`<div class="empty">No APX record matched by employee number.<p>Review the source reconciliation register before linking another record.</p></div>`)}${section('Inner Compass · VORSE',`<div class="state-card"><strong>Assessment link status</strong>${pill(p.compass?.status||'Not linked')}<p>Vitality · Ownership · Reason · Sensitivity · Exploration</p></div><p style="font-size:12px;color:#73839c">Inner Compass measures self-reported preference patterns, not competence, performance or promotion suitability. Its report will become another lens for discussion and self-coaching.</p>${p.compass?.url?`<p><a href="${e(p.compass.url)}" target="_blank" rel="noopener">Open linked Inner Compass report ↗</a></p>`:''}${btn('Link / record assessment','openCompass("'+e(p.id)+'")')}`)}</div>`+section('Evidence sources to triangulate',`<div class="inner-grid"><div class="state-card"><strong>Role and performance evidence</strong><p>Manager review, project outcomes and sustained contribution — not yet imported</p></div><div class="state-card"><strong>Assessments</strong><p>APX available where matched; Compass / 360 / DNA independent sources, not yet integrated</p></div><div class="state-card"><strong>Business opportunity</strong><p>Role vacancies, criticality, experience and succession demands — future HR integration</p></div></div>`)}
function portfolioTab(p){return `${headrow('Talent Portfolio','Actual contributions, projects and stretch assignments — separate from learning',btn('+ Add assignment','openAssignment("'+e(p.id)+'")',true))}<div class="detail-grid">${section('Projects & Assignments',p.portfolio?.length?p.portfolio.map(x=>`<div class="portfolio-card"><strong>${e(x.title)}</strong><div class="portfolio-meta">${pill(x.type||'Project','blue')}${pill(x.status||'In progress')}${x.start?pill(x.start,''):''}</div><p>${e(x.outcome||'Outcome not yet recorded')}</p><div class="muted-sm">Role: ${e(x.role||'Not specified')} · Contribution: ${e(x.contribution||'Not documented')}</div></div>`).join(''):`<div class="empty"><span class="emicon">◫</span>No assignments recorded yet.<p>Record meaningful work, complexity, decisions, results and evidence of contribution.</p></div>`)}${section('Talent investment lens',`<div class="state-card"><strong>Where to invest</strong><p>A high-value portfolio can include high-potential employees, critical specialists and dependable core contributors. Promotion is not the only investment outcome.</p></div><div class="state-card" style="margin-top:10px"><strong>What to measure</strong><p>Business results, breadth, complexity, repeatable contribution, leadership behaviours and assignments completed.</p></div>`)}</div>`;}

function reviews(){const arr=people(),apx=arr.filter(p=>p.apx),grids=counts(apx,p=>p.apx.grid),decided=arr.filter(p=>p.decision!=='Not recorded');return headrow('Talent Review','Triangulate multiple sources, record panel judgements, and agree next assignments',btn('Open exercise candidates','go("exercises")',true))+`<div class="kpi-grid">${kpi('◇','Review decisions',decided.length,'Independently recorded')}${kpi('⬡','HiPo track',arr.filter(p=>p.talentTrack==='HiPo').length,'Reviewed classifications')}${kpi('✦','Accelerated / Superstar',arr.filter(p=>['Accelerated Talent','Superstar'].includes(p.talentTrack)).length,'Reviewed classifications')}${kpi('♟','Critical specialists',arr.filter(p=>p.talentTrack==='Critical Specialist').length,'Role-critical investments')}</div>`+section('Talent 9-Grid · Imported Assessment View',`<div class="matrix">${grids.map(([name,n])=>`<div class="matrix-cell"><div class="n">${n}</div><div class="label">${e(name)}</div><small>Imported classification only</small></div>`).join('')}</div>`)+`<div class="panel-grid halves">${section('Review workflow',`<div class="flow-grid" style="grid-template-columns:repeat(2,1fr)"><div class="flow-step"><div class="flow-icon">◎</div><b>1. Assess</b><p>APX and Inner Compass where available</p></div><div class="flow-step"><div class="flow-icon">▣</div><b>2. Evidence</b><p>Actual performance, project portfolio and sustained results</p></div><div class="flow-step"><div class="flow-icon">◈</div><b>3. Triangulate</b><p>Manager, HR and panel evaluate role context and opportunities</p></div><div class="flow-step"><div class="flow-icon">☑</div><b>4. Decide & assign</b><p>Promotion, exposure, critical role, coaching or retention investment</p></div></div>`)}${section('Panel decisions register',decided.length?`<div class="risk-list">${decided.slice(-10).map(p=>`<div class="risk-item"><span class="risk-dot" style="background:#0b75ca"></span><span><button class="name-link" onclick="go('employee','${e(p.id)}')">${e(p.name)}</button><br>${e(p.decision)} · ${e(p.talentTrack)}</span></div>`).join('')}</div>`:`<div class="empty">No review decisions are recorded yet. Start with a candidate's Progression tab.</div>`)}</div>`+note('A succession or promotion panel should review evidence, role requirements and availability. Readiness bands are guidance; they should not be used as automatic eligibility rules.')+foot();}
function compass(){const total=people().length,linked=people().filter(p=>p.compass?.status==='Linked').length;return headrow('Inner Compass','Self-discovery, coaching and preference patterns as part of an evidence-informed talent system',btn('Employee directory','go("employees")'))+`<div class="kpi-grid">${kpi('◎','VORSE dimensions',5,'Vitality · Ownership · Reason · Sensitivity · Exploration')}${kpi('☑','Linked profiles',linked,'Of '+total+' cohort employees')}${kpi('♧','Self-service', 'Enabled by design','Assessment experience is a separate module')}${kpi('◈','Decision role','One lens','Not a promotion score')}</div>`+section('Self-service to talent action',`<div class="flow-grid"><div class="flow-step"><div class="flow-icon">♧</div><b>SELF-SERVICE</b><p>Employee completes the approved questionnaire, explores their profile and can share authorised results</p></div><div class="flow-step"><div class="flow-icon">◎</div><b>TRIANGULATE</b><p>Coach/HR connects patterns with APX, manager observations, results and role context</p></div><div class="flow-step"><div class="flow-icon">▣</div><b>DECIDE & ASSIGN</b><p>Employee and manager identify actual projects, exposure or coaching actions</p></div><div class="flow-step"><div class="flow-icon">↗</div><b>REVIEW</b><p>Record contribution, changes, readiness and sustained progress over time</p></div></div>`)+`<div class="panel-grid halves">${section('The personal Inner Compass',`<div class="inner-grid"><div class="state-card"><strong>Vitality</strong><p>Energy and approach</p></div><div class="state-card"><strong>Ownership</strong><p>Responsibility preferences</p></div><div class="state-card"><strong>Reason</strong><p>Ways of evaluating</p></div><div class="state-card"><strong>Sensitivity</strong><p>Relational orientation</p></div><div class="state-card"><strong>Exploration</strong><p>Approach to possibilities</p></div></div><p class="muted-sm">Questionnaire/question bank, scoring and report delivery belong to the separately governed Inner Compass module.</p>`)}${section('Integration boundary',`<p><b>Available now:</b> a candidate-level status and report reference field; connect an approved result manually as a pilot.</p><p><b>Not yet connected:</b> the live 30-question VORSE engine, authenticated self-service, coach notes or secure publication of reports.</p>${note('Preferences are not competence. A preference profile must not be turned into a nine-grid placement, a HiPo flag or a promotion pass/fail.')}`)}</div>`+foot();}
function quality(){const arr=people(),missing=arr.filter(p=>!p.apx),email=arr.filter(p=>p.flags?.includes('Email differs between roster and APX dataset')),status=arr.filter(p=>p.flags?.includes('Readiness label differs between tracker Result 2 and APX dataset')),unconf=arr.filter(p=>p.rosterCompletion==='Unconfirmed');let issues=[['Missing roster-to-APX links',missing],['Email differences',email],['Readiness labels differ',status],['Unconfirmed completion',unconf]];return headrow('Data Quality & Import','Reconcile raw exercise records before using analytics for decisions',btn('Export issue CSV','exportIssues()',true)+btn('Backup workspace','backupJSON()'))+
`<div class="kpi-grid">${kpi('▤','Roster records',arr.length,'TRACKER source')}${kpi('☑','Linked APX',arr.filter(p=>p.apx).length,'Matched by employee number')}${kpi('⚑','Email differences',email.length,'May include shared / changed aliases')}${kpi('⇄','Readiness differences',status.length,'Labels from separate sheets')}</div>`+
`${note('<b>Critical distinction:</b> the 92 differences between TRACKER Result 2 and DATASET readiness are review signals. They may arise from different calculations or versions; they are not automatically wrong. Do not overwrite one source with the other.',true)}`+
`<div class="panel-grid halves">${section('Reconciliation Queue',`<div class="risk-list">${issues.map(([name,a])=>`<div class="risk-item"><span class="risk-dot"></span><span><b>${a.length} · ${e(name)}</b><div class="muted-sm">${a.slice(0,3).map(p=>e(p.name)).join(' · ')||'No records'}</div></span></div>`).join('')}<div class="risk-item"><span class="risk-dot"></span><span><b>${findOut().length} APX records outside this roster</b><div class="muted-sm">${findOut().map(p=>e(p.name)).join(' · ')||'No exceptions recorded'}</div></span></div></div>`)}${section('Data exchange',`<p>Use an Excel <b>TRACKER</b> sheet exported to CSV for roster updates. Existing employee numbers are used to reconcile and update records; new IDs are appended.</p><div class="inline-actions">${btn('Import roster CSV','document.getElementById("hiddenImport").click()',true)}${btn('Export current tracker','exportCSV(false)')}${btn('Backup JSON','backupJSON()')}</div><div class="mini-note" style="margin-top:13px">This app runs locally in your browser. There is no hosted database, user authentication, cross-device sync, automatic email delivery or server audit protection in v0.1. Do not publish the file with employee data.</div><div style="margin-top:13px">${btn('Restore saved JSON','openRestore()')}</div>`)}</div>`+
section('Source Exceptions',`<div class="table-wrap"><table class="data-table"><thead><tr><th>Employee No.</th><th>Name</th><th>Flag / Observation</th><th>Action</th></tr></thead><tbody>${[...missing.map(p=>({id:p.id,name:p.name,flag:'No APX record matched by employee number'})),...findOut().map(p=>({id:p.id,name:p.name,flag:'APX result outside selected roster'})),...unconf.map(p=>({id:p.id,name:p.name,flag:'Completion not confirmed in TRACKER'}))].map(x=>`<tr><td>${e(x.id)}</td><td>${e(x.name)}</td><td>${e(x.flag)}</td><td><button class="action-link" onclick="go('employee','${e(x.id)}')">${arr.some(a=>a.id===x.id)?'Review':'Outside roster'}</button></td></tr>`).join('')}</tbody></table></div>`)+foot();}
function foot(){return `<div class="page-foot">INNER COMPASS · TALENT INTELLIGENCE PLATFORM · Local functional pilot v0.1 · Personal data contained in this file · Source: ${e(cohort().source||'Local exercise')} ${window.__NO_SAVE?' · ⚠ Browser storage unavailable: export a backup before closing.':''}</div>`}
function onSearch(s){V.search=s;renderMain()}
function filterHead(s){V.head=s;renderMain()};function filterGrade(s){V.grade=s;renderMain()};function filterStage(s){V.stage=s;renderMain()};function filterMatch(s){V.match=s;renderMain()};function resetFilters(){V.search='';V.head='All';V.stage='All';V.grade='All';V.match='All';V.talent='All';document.getElementById('globalSearch').value='';renderMain()}
function chooseCohort(id){S.active=id;saveState();resetFilters();V.page='exercises';render()}
function selectVisible(yes){document.querySelectorAll('input[name="bulkPerson"]').forEach(x=>{x.checked=yes});updateSelected()}
function updateSelected(){V.selected=Array.from(document.querySelectorAll('input[name="bulkPerson"]:checked')).map(x=>x.value);const count=document.getElementById('selectionCount');if(count)count.textContent=V.selected.length+' selected'}
function bulkApply(){let ids=V.selected||[];if(!ids.length){alert('Select candidates first.');return}let stage=document.getElementById('bulkStage')?.value,owner=document.getElementById('bulkOwner')?.value.trim(),due=document.getElementById('bulkDue')?.value;if(!stage&&!owner&&!due){alert('Choose a stage, owner or due date.');return}if(!confirm(`Update ${ids.length} candidates? This is a local workflow record; it does not send invitations.`))return;ids.forEach(id=>{let p=people().find(x=>x.id===id);if(!p)return;if(stage)changeRecord(p,'workflow',stage);if(owner)changeRecord(p,'owner',owner);if(due)changeRecord(p,'dueDate',due)});saveState();V.selected=[];renderMain()}
function changeRecord(p,field,value){const prior=p[field];if(String(prior||'')===String(value||''))return; p[field]=value;p.timeline??=[];p.timeline.push({date:dateTime(),what:field+' changed',detail:String(prior||'—')+' → '+String(value||'—')});S.audit.push({date:dateTime(),cohort:S.active,id:p.id,field,prior,value});}
function openModal(title,body,onSave=''){document.getElementById('modalRoot').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal" role="dialog" aria-modal="true"><div class="modal-header"><h2>${title}</h2><button class="close" onclick="closeModal()" aria-label="Close">×</button></div><form onsubmit="event.preventDefault();${onSave}"><div class="modal-body">${body}</div><div class="modal-footer"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button type="submit" class="btn primary">Save</button></div></form></div></div>`}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}
function modalField(label,name,type,value,options){return `<div class="field"><label for="m_${e(name)}">${e(label)}</label>${options?`<select id="m_${e(name)}">${options.map(x=>`<option value="${e(x)}" ${x===value?'selected':''}>${e(x)}</option>`).join('')}</select>`:type==='textarea'?`<textarea id="m_${e(name)}">${e(value||'')}</textarea>`:`<input type="${e(type||'text')}" id="m_${e(name)}" value="${e(value||'')}">`}</div>`}
function getf(s){return document.getElementById('m_'+s)?.value||''}
function openEdit(id){V.id=String(id);const p=person();openModal('Update exercise candidate · '+e(p.name),`<div class="fields">${modalField('Workflow stage','workflow','select',p.workflow,PHASES)}${modalField('Recorded roster completion','rosterCompletion','select',p.rosterCompletion,['Unconfirmed','Pending','Completed'])}${modalField('Review owner','owner','text',p.owner)}${modalField('Talent track (panel reviewed)','talentTrack','select',p.talentTrack,TALENT)}${modalField('Next action','nextAction','text',p.nextAction)}${modalField('Due date','dueDate','date',p.dueDate)}${modalField('Remarks','remarks','textarea',p.remarks)}</div>`,'saveEdit()')}
function saveEdit(){let p=person();['workflow','rosterCompletion','owner','talentTrack','nextAction','dueDate','remarks'].forEach(k=>changeRecord(p,k,getf(k)));saveState();closeModal();render()}
function saveReview(id){const p=people().find(q=>q.id===id);if(!p)return;const map={talentTrack:document.getElementById('trackSel').value,decision:document.getElementById('decisionSel').value,decisionNote:document.getElementById('decisionNote').value,nextAction:document.getElementById('nextAction').value,dueDate:document.getElementById('dueDate').value};Object.entries(map).forEach(([k,v])=>changeRecord(p,k,v));if(p.decision!=='Not recorded'&&PHASES.indexOf(p.workflow)<PHASES.indexOf('Decision recorded'))changeRecord(p,'workflow','Decision recorded');saveState();renderMain();alert('Review decisions saved locally. Export a backup for safe retention.')}
function openAssignment(id){V.id=String(id);openModal('Add project / assignment',`<div class="fields">${modalField('Assignment title','title','text','')}${modalField('Type','type','select','Stretch assignment',['Project','Stretch assignment','Acting role','Cross-functional','Business improvement','Other'])}${modalField('Role played','role','text','')}${modalField('Status','status','select','In progress',['Planned','In progress','Completed','On hold'])}${modalField('Start date','start','date','')}${modalField('End date','end','date','')}${modalField('Contribution (what the employee did)','contribution','textarea','')}${modalField('Result / outcome evidence','outcome','textarea','')}</div>`,'saveAssignment()')}
function saveAssignment(){const p=person();const x=Object.fromEntries(['title','type','role','status','start','end','contribution','outcome'].map(k=>[k,getf(k)]));if(!x.title.trim()){alert('Give the assignment a title.');return}p.portfolio??=[];p.portfolio.push({...x,recorded:dateNow()});p.timeline??=[];p.timeline.push({date:dateTime(),what:'Assignment added',detail:x.title});S.audit.push({date:dateTime(),cohort:S.active,id:p.id,field:'portfolio-add',value:x.title});saveState();closeModal();V.tab='Talent portfolio';go('employee',p.id);V.tab='Talent portfolio';renderMain()}
function openDevelopment(id){V.id=String(id);openModal('Add development action',`<div class="fields">${modalField('Learning / coaching action','title','text','')}${modalField('Type','type','select','Coaching',['Coaching','Formal learning','Workshop','Mentoring','Other'])}${modalField('Status','status','select','Planned',['Planned','In progress','Completed','On hold'])}${modalField('Review date','reviewDate','date','')}${modalField('Notes','note','textarea','')}</div>`,'saveDevelopment()')}
function saveDevelopment(){let p=person();let x=Object.fromEntries(['title','type','status','reviewDate','note'].map(k=>[k,getf(k)]));if(!x.title){alert('Enter an action name');return}p.development??=[];p.development.push(x);p.timeline??=[];p.timeline.push({date:dateTime(),what:'Development action added',detail:x.title});saveState();closeModal();go('employee',p.id);V.tab='Development';renderMain()}
function openCompass(id){V.id=String(id);const p=person();openModal('Link Inner Compass evidence',`<div class="fields">${modalField('Integration status','compassStatus','select',p.compass?.status||'Not linked',['Not linked','Invited','In progress','Linked','Review required'])}${modalField('Report URL / reference','compassURL','text',p.compass?.url||'')}${modalField('Coach / HR notes','compassNotes','textarea',p.compass?.notes||'')}</div><p class="muted-sm">Only link a securely authorised report. This does not run or score the questionnaire.</p>`,'saveCompass()')}
function saveCompass(){let p=person();p.compass={status:getf('compassStatus'),url:getf('compassURL'),notes:getf('compassNotes')};p.timeline??=[];p.timeline.push({date:dateTime(),what:'Inner Compass reference updated',detail:p.compass.status});saveState();closeModal();V.tab='Assessments';renderMain()}
function openCreateExercise(){openModal('Create promotion / talent exercise',`<div class="fields">${modalField('Exercise name','name','text','')}${modalField('Exercise code','code','text','')}${modalField('Scope / description','description','textarea','')}</div><p class="muted-sm">Creates an empty cohort register. Import a roster CSV or add candidates manually. Previously created cohorts remain separate.</p>`,'saveExercise()')}
function saveExercise(){let name=getf('name').trim();if(!name){alert('Exercise name is required');return}let id=getf('code').trim()||pid();if(S.exercises.some(x=>x.id===id)){alert('Exercise code already exists');return}S.exercises.push({id,name,description:getf('description'),records:[],created:dateNow(),source:'User-created exercise',sourceMeta:{}});S.active=id;saveState();closeModal();V.page='exercises';render()}
function openAddCandidate(){openModal('Add candidate to current exercise',`<div class="fields">${modalField('Employee number (unique within exercise)','id','text','')}${modalField('Full name','name','text','')}${modalField('Email','email','email','')}${modalField('HQ Head','head','text','')}${modalField('Grade','grade','text','')}${modalField('Cost centre','costCenter','text','')}</div>`,'saveNewCandidate()')}
function makePerson(id,name){return {id,name,email:'',head:'',grade:'',group:'',costCenter:'',rosterCompletion:'Unconfirmed',rosterResult1:'',rosterResult2:'',rosterScore:null,checked:null,remarks:'',apx:null,flags:[],workflow:'Nominated',talentTrack:'Unclassified',decision:'Not recorded',decisionNote:'',owner:'',nextAction:'',dueDate:'',portfolio:[],development:[],timeline:[],compass:{status:'Not linked',url:'',notes:''},review:{performance:'Not recorded',potential:'Not recorded',roleFit:'Not reviewed',panelNotes:''}}}
function saveNewCandidate(){let id=getf('id').trim(),name=getf('name').trim();if(!id||!name){alert('Employee number and name required.');return}if(people().some(p=>p.id===id)){alert('Employee number already exists.');return}let p=makePerson(id,name);['email','head','grade','costCenter'].forEach(k=>p[k]=getf(k));people().push(p);saveState();closeModal();render()}
function download(content,name,mime){const blob=new Blob([content],{type:mime||'text/plain;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function safeName(s){return (s||'exercise').replace(/[^A-Za-z0-9_-]+/g,'_').slice(0,80)}
function csvCell(x){let s=String(x??'');if(/^[\s]*[=+@-]/.test(s))s="'"+s;return /[",\r\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}
function toCSV(rows){return rows.map(r=>r.map(csvCell).join(',')).join('\r\n')}
function exportCSV(directory){const rows=directory?activeFiltered():people();let h=['Employee No.','Full Name','Email','HQ Head','Job Grade','Cost Center','Group','Status (Completed / Pending)','Workflow Stage','Talent Track','APX Readiness','APX Score','APX 9-GRID','Decision','Review Owner','Next Action','Due Date','Notes'];let body=rows.map(p=>[p.id,p.name,p.email,p.head,p.grade,p.costCenter,p.group,p.rosterCompletion,p.workflow,p.talentTrack,p.apx?.readiness,p.apx?.score,p.apx?.grid,p.decision,p.owner,p.nextAction,p.dueDate,p.remarks]);download('\ufeff'+toCSV([h,...body]),safeName(cohort().name)+'_tracker_'+dateNow()+'.csv','text/csv;charset=utf-8')}
function exportIssues(){let rows=[['Employee No.','Name','Issue Type','Roster email','APX email','Tracker Result 2','APX Readiness']];people().forEach(p=>(p.flags||[]).forEach(f=>rows.push([p.id,p.name,f,p.email,p.apx?.email,p.rosterResult2,p.apx?.readiness])));findOut().forEach(p=>rows.push([p.id,p.name,'APX result outside roster','','','',p.readiness]));download('\ufeff'+toCSV(rows),safeName(cohort().name)+'_reconciliation_'+dateNow()+'.csv','text/csv;charset=utf-8')}
function backupJSON(){download(JSON.stringify({...S,exportedAt:new Date().toISOString(),appVersion:'0.1'},null,2),'InnerCompass_TalentIntelligence_backup_'+dateNow()+'.json','application/json')}
function parseCSV(text){text=text.replace(/^\ufeff/,'');let rows=[],row=[],value='',inside=false;for(let i=0;i<text.length;i++){let ch=text[i],n=text[i+1];if(ch==='"'&&inside&&n==='"'){value+='"';i++;continue}if(ch==='"'){inside=!inside;continue}if(ch===','&&!inside){row.push(value);value='';continue}if((ch==='\r'||ch==='\n')&&!inside){if(ch==='\r'&&n==='\n')i++;row.push(value);if(row.some(x=>x.trim()))rows.push(row);row=[];value='';continue}value+=ch}row.push(value);if(row.some(x=>x.trim()))rows.push(row);return rows}
function importCSVFile(evt){let file=evt.target.files?.[0];evt.target.value='';if(!file)return;let reader=new FileReader();reader.onload=()=>{let rows=parseCSV(String(reader.result||''));if(rows.length<2){alert('CSV has no data rows');return}let header=rows[0].map(x=>x.trim().toLowerCase());let ix=(names)=>names.map(n=>header.indexOf(n)).find(n=>n>=0)??-1;
const iID=ix(['employee no.','employee no','employee number','employee id','id']),iName=ix(['full name','name']),iEmail=ix(['email']),iHead=ix(['hq head','head']),iGrade=ix(['job grade','grade']),iCost=ix(['cost center','cost centre']),iGroup=ix(['group']),iStatus=ix(['status (completed / pending)','status','roster status']);if(iID<0||iName<0){alert('CSV must include Employee No. and Full Name headers. Export TRACKER as CSV first.');return}let added=0,updated=0,seen=0;for(let r of rows.slice(1)){let id=String(r[iID]||'').trim(),name=String(r[iName]||'').trim();if(!id||!name)continue;seen++;let p=people().find(x=>x.id===id);if(!p){p=makePerson(id,name);people().push(p);added++}else updated++;let col={name:iName,email:iEmail,head:iHead,grade:iGrade,costCenter:iCost,group:iGroup,rosterCompletion:iStatus};Object.entries(col).forEach(([k,j])=>{if(j>=0&&String(r[j]||'').trim())p[k]=String(r[j]).trim()})}saveState();render();alert(`Imported ${seen} roster rows: ${added} added, ${updated} updated. Existing review classifications and portfolio records preserved.`)};reader.readAsText(file)}
function openRestore(){let file=document.createElement('input');file.type='file';file.accept='.json,application/json';file.onchange=()=>{let a=file.files?.[0];if(!a)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(String(r.result));if(!Array.isArray(x.exercises)||!x.exercises.length)throw Error('No exercises found');if(!confirm('Restore the selected workspace backup? This replaces the current local working data.'))return;S={active:x.active,exercises:x.exercises,audit:x.audit||[]};saveState();V.page='overview';render();alert('Workspace restored.')}catch(e){alert('This is not a valid workspace backup: '+e.message)}};r.readAsText(a)};file.click()}
render();
